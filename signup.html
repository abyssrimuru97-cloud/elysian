<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Élysian | VIP Sign Up</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="signup.css">

</head>

<body>

<div class="background"></div>

<div class="gold-circle circle1"></div>
<div class="gold-circle circle2"></div>
<div class="gold-circle circle3"></div>

<div class="signup-card">

<div class="logo">

<i class="fa-solid fa-crown"></i>

<h1>ÉLYSIAN</h1>

<p>CREATE VIP ACCOUNT</p>

</div>

<form id="signupForm">

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-phone"></i>

<input
type="tel"
placeholder="Phone Number"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<span id="togglePassword">

<i class="fa-solid fa-eye"></i>

</span>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

<button type="submit">

<i class="fa-solid fa-user-plus"></i>

Create VIP Account

</button>

</form>

<div class="links">

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

<script src="signup.js"></script>

</body>

</html>
