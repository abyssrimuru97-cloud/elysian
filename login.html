<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Élysian VIP Access</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="background"></div>

<div class="gold-circle circle1"></div>
<div class="gold-circle circle2"></div>
<div class="gold-circle circle3"></div>

<div class="login-card">

<div class="logo">

<i class="fa-solid fa-crown"></i>

<h1>ÉLYSIAN</h1>

<p>VIP MEMBER ACCESS</p>

</div>

<form id="loginForm">

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<span id="togglePassword">

<i class="fa-solid fa-eye"></i>

</span>

</div>

<button type="submit">

Enter The Lounge

</button>

</form>

<div class="links">

<a href="#">Forgot Password?</a>

<a href="signup.html">

Become a VIP Member

</a>

</div>

</div>

<script src="login.js"></script>

</body>
</html>
